<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F275F"/>
      <stop offset="100%" stop-color="#081B4B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="640" cy="130" r="150" fill="#CBD5E1" opacity="0.45"/>
  <circle cx="170" cy="390" r="130" fill="#FDE68A" opacity="0.45"/>
  <!-- Curated Display Pedestal -->
  <rect x="130" y="360" width="540" height="32" rx="6" fill="#081B4B"/>
  <!-- Minimalist Headphones -->
  <path d="M210 250 C210 185, 310 185, 310 250" stroke="#081B4B" stroke-width="14" stroke-linecap="round" fill="none"/>
  <rect x="195" y="242" width="32" height="56" rx="14" fill="#D99B16"/>
  <rect x="293" y="242" width="32" height="56" rx="14" fill="#D99B16"/>
  <!-- Minimalist Tote Bag -->
  <path d="M390 175 C390 135, 450 135, 450 175" stroke="#081B4B" stroke-width="8" fill="none"/>
  <rect x="355" y="175" width="130" height="175" rx="10" fill="url(#navy)"/>
  <rect x="385" y="220" width="70" height="4" rx="2" fill="#F6C453"/>
  <rect x="398" y="236" width="44" height="4" rx="2" fill="#94A3B8"/>
  <!-- Travel Carry-on / Gear -->
  <rect x="520" y="195" width="110" height="155" rx="14" fill="#FFFFFF" stroke="#081B4B" stroke-width="4"/>
  <rect x="550" y="150" width="50" height="45" rx="4" stroke="#081B4B" stroke-width="4" fill="none"/>
  <line x1="542" y1="230" x2="608" y2="230" stroke="#D99B16" stroke-width="4" stroke-linecap="round"/>
  <line x1="542" y1="255" x2="608" y2="255" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <line x1="542" y1="280" x2="608" y2="280" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
</svg>
